name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  Lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: sudo apt update && sudo apt install --yes tox libev-dev libvirt-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Ruff and mypy
        run: |
          tox -e ruff-check,mypy
  Tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgresql:
        image: postgres:latest
        # Provide the password for postgres
        env:
          POSTGRES_DB: workspace
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: pass
        # Set health checks to wait until postgres has started
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: sudo apt update && sudo apt install --yes libev-dev libvirt-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Unit tests
        run: |
          tox -e ${{ matrix.python-version }}
      - name: Functional tests
        env:
          DATABASE_URI: "postgresql://workspace:pass@localhost:5432/workspace"
        run: |
          tox -e ${{ matrix.python-version }}-functional
  Integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgresql:
        image: postgres:18
        env:
          POSTGRES_DB: workspace_test
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: pass
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system requirements
        run: sudo apt update && sudo apt install --yes libev-dev libvirt-dev postgresql-client util-linux
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Verify namespace restriction before tests
        run: test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" -eq 1
      - name: Full integration suite
        env:
          WORKSPACE_TEST_DB_URL: "postgresql://workspace:pass@localhost:5432/workspace_test"
          WORKSPACE_REQUIRE_INTEGRATION_TESTS: "1"
          WORKSPACE_PRIVILEGED_NAMESPACE_TEST: "1"
        run: tox -e 3.12-integration -- --junitxml=integration-results.xml -ra
      - name: Verify namespace restriction after tests
        if: always()
        run: test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" -eq 1
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: integration-results.xml
          if-no-files-found: warn
  Coverage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: sudo apt update && sudo apt install --yes libev-dev libvirt-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Coverage
        run: |
          tox -e begin,${{ matrix.python-version }},end
