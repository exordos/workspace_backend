name: tests

on:
  push:
  pull_request:

jobs:
  Lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: sudo apt update && sudo apt install --yes tox libev-dev libvirt-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: ruff
        run: |
          tox -e ruff-check
  Tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgresql:
        image: postgres:latest
        # Provide the password for postgres
        env:
          POSTGRES_DB: workspace
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: pass
        # Set health checks to wait until postgres has started
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: sudo apt update && sudo apt install --yes libev-dev libvirt-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Unit tests
        run: |
          tox -e ${{ matrix.python-version }}
      - name: Functional tests
        env:
          DATABASE_URI: "postgresql://workspace:pass@localhost:5432/workspace"
        run: |
          tox -e ${{ matrix.python-version }}-functional
  Integration-regressions:
    runs-on: ubuntu-24.04
    services:
      postgresql:
        image: postgres:latest
        env:
          POSTGRES_DB: workspace_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install requirements
        run: sudo apt update && sudo apt install --yes libev-dev libvirt-dev
      - uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Build integration environment
        run: tox -e develop --notest
      - name: Run responsiveness regressions
        env:
          WORKSPACE_TEST_DB_URL: >-
            postgresql://workspace:pass@localhost:5432/workspace_test
        run: |
          set -euo pipefail
          .tox/develop/bin/python -c \
            'import os, psycopg; psycopg.connect(os.environ["WORKSPACE_TEST_DB_URL"]).close()'
          .tox/develop/bin/pytest -q \
            --junitxml=integration-regressions.xml \
            workspace/tests/integration/test_messenger_v2.py::test_opening_store_does_not_refresh_existing_project_user \
            workspace/tests/integration/test_projection_performance.py::test_project_user_ensure_does_not_create_project_lock_convoy \
            workspace/tests/integration/test_projection_performance.py::test_noninteractive_read_counter_waits_for_read_state_turn \
            workspace/tests/integration/test_projection_performance.py::test_interactive_read_counter_remains_eligible_for_fallback \
            workspace/tests/integration/test_projection_performance.py::test_fair_scheduler_bounds_fanout_under_large_read_backlog
          .tox/develop/bin/python - <<'PY'
          import xml.etree.ElementTree as xml_etree

          root = xml_etree.parse("integration-regressions.xml").getroot()
          cases = root.findall(".//testcase")
          bad = [
              case
              for case in cases
              if any(case.find(name) is not None for name in ("failure", "error", "skipped"))
          ]
          if len(cases) != 5 or bad:
              raise SystemExit(
                  f"expected five passing integration regressions: cases={len(cases)} bad={len(bad)}"
              )
          PY
  Coverage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: sudo apt update && sudo apt install --yes libev-dev libvirt-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox-uv
        run: uv tool install tox --with tox-uv
      - name: Coverage
        run: |
          tox -e begin,${{ matrix.python-version }},end
