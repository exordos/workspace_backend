[db]
connection_url = postgresql://workspace:pass@localhost:5432/workspace?options=-c%20work_mem%3D32MB%20-c%20jit%3Doff
connection_connect_timeout = 30
connection_statement_timeout = 240
connection_transaction_timeout = 300
connection_idle_in_transaction_session_timeout = 240
connection_tcp_user_timeout = 300
connection_keepalives_idle = 60
connection_keepalives_interval = 30
connection_keepalives_count = 5


[logging]
config = logging.yaml


[iam]
iam_endpoint = http://127.0.0.1:10101/api/core/v1/iam/clients/00000000-0000-0000-0000-000000000000
audience = Exordos
hs256_jwks_decryption_key =
# token_encryption_algorithm = HS256


[HS256]
# encryption_key = secret


[workspace_api]
bind_host = 127.0.0.1
bind_port = 21084
workers = 1


[messenger_api]
bind_host = 127.0.0.1
bind_port = 21081
workers = 1


[messenger_reactions]
user_list_limit = 4


[messenger_worker_agent]
event_retention_seconds = 259200
event_prune_interval_seconds = 300
event_prune_batch_size = 25000
heartbeat_retention_seconds = 86400


[topic_summary]
secret_encryption_key =
connect_timeout_seconds = 30
request_timeout_seconds = 1500
topic_claim_seconds = 5400
endpoint_claim_seconds = 1800
