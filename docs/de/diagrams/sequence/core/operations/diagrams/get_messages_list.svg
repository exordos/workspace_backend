8">Zeilen ohne Berechnungen; uuid=PLACEMENT.uuid;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.6362" x="282.703" y="255.9248">created_at/updated_at aus canonical MESSAGE</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="10" id="msg4"><polygon fill="#181818" points="51.6059,307.1459,41.6059,311.1459,51.6059,315.1459,47.6059,311.1459" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="45.6059" x2="264.703" y1="311.1459" y2="311.1459"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.1211" x="57.6059" y="287.6308">200, &#246;ffentlich JSON</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.3081" x="57.6059" y="305.3369">Titeln X-Pagination-*</text></g><path d="M56,324.1459 L56,440.1459 L813,440.1459 L813,334.1459 L803,324.1459 L56,324.1459" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M803,324.1459 L803,334.1459 L813,334.1459 L803,324.1459" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="553.6703" x="62" y="343.0429">Keine Aufzeichnungen, transactional outbox, Aufgabe, Hintergrunddarsteller oder Ereignis</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="448.7734" x="62" y="360.7489">Nein, nicht COUNT / GROUP BY / Wiederherstellung w&#228;hrend der Anfrage</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.7893" x="62" y="378.4549">Verborgen binding_uuid dient nur als innerer Zeilen-ID</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="403.0525" x="62" y="396.1609">Marker tuple = (MESSAG