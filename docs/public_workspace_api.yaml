  /v1/users/:
    get:
      summary: Get WorkspaceUsers
      tags:
      - WorkspaceUser
      parameters:
      - name: q
        in: query
        required: false
        description: "Filter expression (a subset of AIP-160). Combines with the field\n\
          parameters, which stay the typed way to ask for equality.\n\n    name =\
          \ \"vm1\" AND size > 10\n    tags:\"env:prod\" OR tags:\"env:staging\"\n\
          \    NOT (state = error) AND created_at >= \"2026-07-01T00:00:00Z\"\n\n\
          Operators: `=` `!=` `<` `<=` `>` `>=`, `:` (an array holds the element,\n\
          or with `*` that the field is set), `AND` `OR` `NOT`, parentheses.\nThe\
          \ keywords are uppercase, and `OR` binds tighter than `AND`. Values\ncarrying\
          \ `:`, `.` or spaces must be quoted."
        schema:
          type: string
        example: name = "vm1"
        x-ra-filter-fields:
        - avatar
        - created_at
        - email
        - first_name
        - last_name
        - last_ping_at
        - source
        - status
        - status_emoji
        - status_text
        - updated_at
        - username
        - uuid
      - $ref: '#/components/parameters/WorkspaceUser_uuid'
      - $ref: '#/components/parameters/WorkspaceUser_created_at'
      - $ref: '#/components/parameters/WorkspaceUser_updated_at'
      - $ref: '#/components/parameters/WorkspaceUser_username'
      - $ref: '#/components/parameters/WorkspaceUser_source'
      - $ref: '#/components/parameters/WorkspaceUser_status'
      - $ref: '#/components/parameters/WorkspaceUser_status_emoji'
      - $ref: '#/components/parameters/WorkspaceUser_status_text'
      - $ref: '#/components/parameters/WorkspaceUser_first_name'
      - $ref: '#/components/parameters/WorkspaceUser_last_name'
      - $ref: '#/components/parameters/WorkspaceUser_email'
      - $ref: '#/components/parameters/WorkspaceUser_avatar'
      - $ref: '#/components/parameters/WorkspaceUser_last_ping_at'
      - name: page_limit
        in: query
        description: Maximum resources returned in this page.
        schema:
          type: integer
          minimum: 0
      - name: page_marker
        in: query
        description: Last resource identifier from the previous page.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: WorkspaceUser_Filter
          content:
