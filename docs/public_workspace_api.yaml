      security:
      - bearerAuth: []
      description: Send a message; an absent or null topic_uuid selects the stream's
        default topic. All six payload kinds are allowed regardless of encryption,
        except e2ee is forbidden for a shared Zulip stream. Only the owner role may
        send key_announced; saving the message and updating current_encryption_key_uuid
        is atomic. Old e2ee key UUIDs are accepted. The backend does not validate
        Base64, encrypt, or store plaintext private or symmetric keys.
