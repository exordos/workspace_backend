                    - key_uuid
                    - device_id
                    - device_name
                    - public_key
                    additionalProperties: false
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - key_grant
                      key_uuid:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                        format: uuid
                      request_message_uuid:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                        format: uuid
                      sender_device_id:
                        type: string
                        example: any_string
                        maxLength: 255
                      recipient_device_id:
                        type: string
                        example: any_string
                        maxLength: 255
                      content:
                        type: string
                        example: any_string
                        minLength: 1
                        maxLength: 40000
                    required:
                    - kind
                    - key_uuid
                    - request_message_uuid
                    - sender_device_id
                    - recipient_device_id
                    - content
                    additionalProperties: false
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - key_reject
                      key_uuid:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                        format: uuid
                      request_message_uuid:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                        format: uuid
                      sender_device_id:
                        type: string
                        example: any_string
                        maxLength: 255
                      recipient_device_id:
                        type: string
                        example: any_string
                        maxLength: 255
                    required:
                    - kind
