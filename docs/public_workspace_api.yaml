                    - request_message_uuid
                    - sender_device_id
                    - recipient_device_id
                    additionalProperties: false
                  - type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - key_announced
                      key_uuid:
                        type: string
                        example: 00000000-0000-0000-0000-000000000000
                        format: uuid
                    required:
                    - kind
                    - key_uuid
                    additionalProperties: false
                  description: Fixed message payload selected by kind. Only markdown
                    is interpreted as Markdown and used for mentions and summaries.
                    Other kinds remain opaque in history and realtime.
              required:
              - stream_uuid
