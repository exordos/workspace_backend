      - name: page_marker
        in: query
        description: Last resource identifier from the previous page.
        schema:
          type: integer
          minimum: 0
      - name: epoch_generation
        in: query
        description: Generation paired with a non-zero epoch cursor.
        schema:
          type: string
      responses:
        '200':
          description: WorkspaceEvent_Filter
          content:
            application/json:
              schema:
                type: array
