openapi: 3.0.3
info:
  title: Workspace v1 API
  version: 1.2.5.dev0+g76040871f.d20260929
  description: IAM-authenticated Workspace API
components:
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      title: error
      description: Error occurred while processing request
      type: object
      required:
      - status
      - json
      properties:
        status:
          type: integer
          description: The HTTP status code
          minimum: 400
          maximum: 599
          example: 503
        json:
          type: object
          description: Detail error map
          required:
          - code
          - type
          - message
          properties:
            code:
              type: integer
              description: The HTTP status code
              minimum: 400
              maximum: 599
              example: 503
            type:
              type: string
              description: Error class name
              example: OSError
            message:
              type: string
              description: Error message
              example: A human-readable explanation of problem
      example:
        code: 400
        json:
          code: 400
          type: ValidationErrorException
          message: Validation error occurred.
