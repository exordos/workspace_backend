[tox]
envlist = begin,py3{10,11,12,13,14},end
          py3{10,11,12,13,14}-functional
          py312-integration
          ruff,ruff-check,mypy
minversion = 2.0
skipsdist = false
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
extras =
  test
setenv =
  PACKAGE_NAME=workspace
  TEST_PATH={env:PACKAGE_NAME}/tests/unit
  functional: TEST_PATH={env:PACKAGE_NAME}/tests/functional
  functional: DATABASE_URI={env:DATABASE_URI:postgresql://workspace:pass@localhost:5432/workspace}
  integration: TEST_PATH={env:PACKAGE_NAME}/tests/integration
  integration: WORKSPACE_TEST_DB_URL={env:WORKSPACE_TEST_DB_URL:postgresql://workspace:pass@localhost:5432/workspace_test}
  integration: WORKSPACE_REQUIRE_INTEGRATION_TESTS={env:WORKSPACE_REQUIRE_INTEGRATION_TESTS:0}
  integration: WORKSPACE_PRIVILEGED_NAMESPACE_TEST={env:WORKSPACE_PRIVILEGED_NAMESPACE_TEST:0}
commands =
  !nocoverage: coverage run -p -m pytest {env:TEST_PATH} {posargs} --timer-top-n=10 --durations=20
  nocoverage: python -m pytest {env:TEST_PATH} {posargs} --timer-top-n=10 --durations=20

[testenv:begin]
runner = uv-venv-lock-runner
envdir = {toxworkdir}/cover
commands =
  coverage erase

[testenv:end]
runner = uv-venv-lock-runner
envdir = {toxworkdir}/cover
commands =
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report --skip-covered

[testenv:ruff-check]
extras =
  ruff
runner = uv-venv-lock-runner
commands = ruff check .

[testenv:ruff]
extras =
  ruff
runner = uv-venv-lock-runner
commands = ruff format

[testenv:mypy]
extras =
  mypy
runner = uv-venv-lock-runner
commands = mypy -p workspace

[testenv:docs]
basepython = python3
runner = uv-venv-lock-runner
extras =
  docs
commands = zensical serve --dev-addr 0.0.0.0:8181

[testenv:docs-build]
basepython = python3
runner = uv-venv-lock-runner
extras =
  docs
commands = zensical build --clean

[testenv:develop]
runner = uv-venv-lock-runner
extras =
  test
usedevelop=true
